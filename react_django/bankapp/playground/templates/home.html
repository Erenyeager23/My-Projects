<html>
    <head>

    </head>
    <body>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="amount" placeholder="Amount to deposit">
            <button type="submit" name="deposit">Deposit</button>
            <button type="submit" name="withdraw" value="true">Withdraw</button>
            <button type="submit" name="show" value="true">Check Balance</button>
        </form>
        <h2>{{ message }}</h2>
        {% if balance != "" %}
            <p>Current Balance: {{ balance }}</p>
        {% endif %}
    </body>
</html>
