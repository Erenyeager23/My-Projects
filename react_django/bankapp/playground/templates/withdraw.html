<!DOCTYPE html>
<html>
<head>
    <title>Withdraw Money</title>
</head>
<body>

    <h1>Withdraw Money</h1>

    <form method="POST">
        {% csrf_token %}

        <input
            type="number"
            name="amount"
            step="0.01"
            min="0"
            placeholder="Enter Amount">

        <button type="submit">
            Withdraw
        </button>

    </form>

    <h3>{{ message }}</h3>

    <a href="/balance/">Back to Balance</a>

</body>
</html>
